module: kde-plasma
component: desktop-setup
description: "KDE Plasma setup (example template for Void Linux)"
desktop:
  name: KDE Plasma
  packages:
    - plasma5
    - plasma-desktop
    - kde-applications-meta
    - sddm
    - sddm-theme-debian-maui
    - kdeconnect
    - dolphin
    - konsole

notes: |
  Plasma package names vary. On Void you may install `plasma-meta` or individual plasma5-* packages. Configure SDDM as display manager.
