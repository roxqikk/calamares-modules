module: sway
component: desktop-setup
description: "Sway (Wayland i3-compatible) setup (example template for Void Linux)"
desktop:
  name: Sway
  packages:
    - sway
    - swaybg
    - swayidle
    - wofi
    - wl-clipboard
    - waybar
    - mako

notes: |
  Sway is a Wayland compositor similar to i3. Requires appropriate GPU drivers and Wayland stack.
