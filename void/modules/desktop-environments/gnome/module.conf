module: gnome
component: desktop-setup
description: "GNOME desktop setup (example template for Void Linux)"
desktop:
  name: GNOME
  packages:
    - gnome
    - gnome-extra
    - gdm
    - gnome-shell

notes: |
  GNOME requires gdm or another compatible display manager. Package names may differ on Void.

options:
  nvidia: false
  enable_packages: []
  disable_packages: []
