module: hyprland
component: desktop-setup
description: "Hyprland compositor setup (example template for Void Linux)"
desktop:
  name: Hyprland
  packages:
    - hyprland
    - wayland-protocols
    - wlroots
    - mako
    - wlr-randr
    - wofi
    - hyprpaper
    - swaybg
    - xdg-desktop-portal-wayland
    - libinput
    - pipewire
    - pipewire-pulse
    - waybar

notes: |
  Hyprland and Wayland-based setups require proper GPU drivers and a compositor-aware display/login manager. This is a template — ensure package names match Void repo.

options:
  nvidia: false
  enable_packages: []
  disable_packages: []
