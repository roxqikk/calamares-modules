module: i3wm
component: desktop-setup
description: "i3 window manager setup (example template for Void Linux)"
desktop:
  name: i3
  packages:
    - i3
    - i3status
    - dmenu
    - terminator
    - feh
    - network-manager-applet

notes: |
  For a tiling WM like i3 you may want LightDM or a .xinitrc wrapper to start the session. NetworkManager applets help Wi-Fi setup in user session.
