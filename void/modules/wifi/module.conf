module: wifi
component: network-setup
description: "Wi-Fi setup helpers for Void Linux (NetworkManager and wpa_supplicant examples)"
methods:
  - nmcli
  - wpa_supplicant

notes: |
  This module provides scripts and examples to connect to Wi‑Fi during installer runtime.
  Prefer NetworkManager (nmcli) if available. If using wpa_supplicant, you may need dhcpcd or udhcpc.
