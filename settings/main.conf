# Example Calamares settings / workflow

This is an example main.conf for Calamares showing a simple workflow that includes:
- locale/keyboard
- wifi step
- partitioning
- package installation (base)
- services step (enable/disable packages, NVIDIA)
- desktop selection
- users

This file is a simplified example — adapt to your Calamares version and schema.

workflow:
  - locale-keyboard
  - wifi
  - partition-presets
  - package-installation
  - services
  - desktop-selection
  - users
  - post-install

# Each step corresponds to a module in void/modules/*
